<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Onteddu Sudhakar Reddy, cybersecurity and full-stack developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <style>
    /* Text stays fully visible in its base state. If an app skips animation, the header still reads. */
    .bg { fill: #0a0d14; }
    .glow-a { animation: drift-a 16s ease-in-out infinite alternate; }
    .glow-b { animation: drift-b 20s ease-in-out infinite alternate; }
    .name {
      fill: #f8fafc;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 62px;
      font-weight: 700;
      animation: rise 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s both;
    }
    .rule {
      fill: url(#accent);
      transform-box: fill-box;
      transform-origin: left center;
      animation: sweep 1.3s cubic-bezier(0.6, 0, 0.2, 1) 0.6s both;
    }
    .role {
      fill: #94a3b8;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 22px;
      font-weight: 500;
      animation: rise 1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.9s both;
    }
    .tag {
      fill: #22d3ee;
      font-family: Consolas, "Courier New", monospace;
      font-size: 16px;
      animation: rise 1s cubic-bezier(0.2, 0.7, 0.2, 1) 1.3s both;
    }
    .cursor { fill: #22d3ee; animation: blink 1s step-end infinite; }

    @keyframes drift-a { from { transform: translate(0, 0); } to { transform: translate(90px, -40px); } }
    @keyframes drift-b { from { transform: translate(0, 0); } to { transform: translate(-110px, 30px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>

  <rect class="bg" width="1000" height="260"/>
  <circle class="glow-a" cx="180" cy="110" r="260" fill="url(#glowCyan)"/>
  <circle class="glow-b" cx="860" cy="200" r="240" fill="url(#glowViolet)"/>

  <text class="name" x="60" y="118">Onteddu Sudhakar Reddy</text>
  <rect class="rule" x="60" y="140" width="320" height="3" rx="1.5"/>
  <text class="role" x="60" y="182">Cybersecurity · Full-stack web · Python</text>
  <text class="tag" x="60" y="222">&gt; CSE 2027 · Guntur, India<tspan class="cursor">_</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
