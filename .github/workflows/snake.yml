name: Generate contribution animations

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animated contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Sudhakar-reddy20
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2338BDF8&color_dots=%230B1020,%230B3954,%230C4A6E,%230EA5E9,%2367E8F9
            dist/github-contribution-grid-snake.gif?color_snake=%2367E8F9&color_dots=%230B1020,%230B3954,%230C4A6E,%230EA5E9,%2367E8F9&color_background=%23050816

      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
